<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira página web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Minha primeira página web</h1>
        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a> </li>
                <li><a href="#servicos">Serviços</a> </li>
                <li> <a href="#contato">Contato</a> </li>
                <li><a href="#projetos">Projetos</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="sobre">
            <h2>Sobre Mim</h2>
            <p>Meu nome é fulano e sou DEV</p>
        </section>
        <section id="servicos">
            <h2>Serviços</h2>
            <ul>
                <li>Desenvolvimento de Websites</li>
                <li>Design Responsivo</li>
                <li>Otimização de performance</li>
            </ul>
        </section> 
        <section id="contato">
            <h2>Contatos</h2>
            <form action="">
                <label for="username">Usuário:</label>
                <input type="text" name="username" id="username" required>
                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" required pattern=".{6,}"
                title="A senha deve ter 6 caracteres.">
                <button type="submit">Enviar</button>
            </form>
        </section>
        <section id="projetos">
            <h2>Projetos</h2>
            <ol>
                <li><img src="" alt=""></li>
                <li><img src="" alt=""></li>
                <li><img src="" alt=""></li>
            </ol>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Unifan. Todos os direitos reservados</p>
    </footer>
 </body>
</html>
